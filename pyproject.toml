[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redmine-readonly-export"
version = "0.1.0"
description = "A defensive, read-only Redmine issue exporter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
redmine-readonly = "redmine_readonly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
