name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            venv-python: ./.venv/bin/python
          - os: windows-latest
            python-version: "3.11"
            venv-python: ./.venv/Scripts/python.exe
          - os: windows-latest
            python-version: "3.12"
            venv-python: ./.venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          ${{ matrix.venv-python }} -m pip install -e ".[test]"
      - name: Run tests
        run: ${{ matrix.venv-python }} -m pytest
      - name: Run Ruff lint
        run: ${{ matrix.venv-python }} -m ruff check .
      - name: Check Ruff formatting
        run: ${{ matrix.venv-python }} -m ruff format --check .
      - name: Compile Python sources
        run: ${{ matrix.venv-python }} -m compileall -q src tests
      - name: Test launcher on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows\launcher.Tests.ps1
          if (-not $?) { throw 'Windows launcher tests failed' }
