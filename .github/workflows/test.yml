name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff lint
        run: ruff check .
      - name: Check Ruff formatting
        run: ruff format --check .
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Prepare Windows launcher test venv
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv --system-site-packages .venv
          if ($LASTEXITCODE -ne 0) { throw 'test venv setup failed' }
          # Reuse the package/dependencies installed above via system site.
      - name: Test launcher on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows\launcher.Tests.ps1
          if (-not $?) { throw 'Windows launcher tests failed' }
